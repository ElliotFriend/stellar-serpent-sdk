[project]
name = "serpent"
version = "0.0.1"
description = "Write Soroban smart contracts in Python (experimental)"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=7",
    "hypothesis>=6",
    "ruff>=0.16",
    "mypy>=2,<3",
    "stellar-sdk>=15,<16",
    "wasmtime==48.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "spikes"]

[tool.ruff.lint.per-file-ignores]
# Historical evidence copied verbatim from the original throwaway spike
# compiler (Task 2, Step 1). Never edit its content to appease ruff.
"spikes/spike1/reference/*" = ["ALL"]
# Transcribed verbatim from the Spike 1 task brief, including the import
# order; do not reorder to appease ruff's import-sort rule (I001).
"spikes/spike1/contract_src.py" = ["I001"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"
