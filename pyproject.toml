[project]
name = "serpent"
version = "0.0.1"
description = "Write Soroban smart contracts in Python (experimental)"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = []

# `serpent.spec` -- and ONLY `serpent.spec` -- needs stellar-sdk, for the XDR
# classes that build the Soroban custom sections (spec Sec.7). It is an extra,
# not a dependency, so `pip install serpent` stays zero-dep and an authored
# contract carries nothing at runtime; `tests/unit/test_core_zero_dep.py`
# enforces the boundary. The dev group below installs it for the test suite
# (`uv sync --all-groups` installs groups, not extras), so do not remove it
# from there.
[project.optional-dependencies]
spec = ["stellar-sdk>=15,<16"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=7",
    "hypothesis>=6",
    "ruff>=0.16",
    "mypy>=2,<3",
    "stellar-sdk>=15,<16",
    "wasmtime==48.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["real_host: runs against the embedded soroban-env-host (serpent_host); skipped loudly when the extension is not built, failed when SERPENT_REQUIRE_REAL_HOST=1 (ruling U2)"]

[tool.ruff]
line-length = 100
# `examples/` is deliberately NOT added here. `src` is ruff's first-party
# resolution root list, and adding a fourth entry changes how isort resolves
# imports in the OTHER roots: it makes `ruff check .` start reporting I001 on
# `spikes/spike1/test_local_run.py`, which is frozen historical evidence that
# must not be reformatted (R5). The examples import `serpent` and nothing else,
# so they need no resolution root; the gate that covers them is
# `ruff format --check src tests examples` (ci.yml) plus `ruff check .`, which
# already reaches every file in the repo.
src = ["src", "tests", "spikes"]
# `tests/must_reject/` fixtures (M1-C Task 2) are deliberately invalid-as-
# formatted Python -- excluded from `ruff format --check` too, not just lint
# (dossier E15, plan BL-2; there is precedent for the opposite in this repo,
# E3, so this exclusion must be deliberate and commented, not silent).
extend-exclude = ["tests/must_reject"]

[tool.ruff.lint.per-file-ignores]
# Historical evidence copied verbatim from the original throwaway spike
# compiler (Task 2, Step 1). Never edit its content to appease ruff.
"spikes/spike1/reference/*" = ["ALL"]
# spikes/ is frozen historical evidence, transcribed verbatim (including
# import order) and imported by bare top-level module name. isort's
# first/third-party split for those names depends on what exists under the
# `src` roots above, so an unrelated commit elsewhere in the repo can flip a
# spike file's sections: adding `tests/harness/` in M1-D made `harness`
# first-party and broke `spikes/spike1/test_local_run.py`. Never reorder a
# spike's imports to appease I001.
"spikes/**" = ["I001"]
# Transcribed verbatim from the Task 1 (val.py) brief, including the import
# order; do not reorder to appease ruff's import-sort rule (I001).
"tests/unit/test_val_properties.py" = ["I001"]
# `tests/must_reject/` fixtures are the executable must_reject/ subset spec
# (M1-C Task 2): deliberately invalid-as-linted Python (bare int error
# members, missing param annotations, ...), read AS TEXT by the runner
# (tests/unit/test_must_reject.py) and never imported (dossier E15, BL-2).
"tests/must_reject/**" = ["ALL"]

[tool.mypy]
python_version = "3.11"
strict = true
# `examples/` is in scope (M1-E ruling E6): the shipped examples are the
# executable proof of the zero-plugin `mypy --strict` pitch, so an example that
# only type-checks with a plugin -- or not at all -- must fail the gate. It is a
# FLAT directory of modules, not a package (no `__init__.py`), which is all mypy
# needs; `tests/unit/test_examples.py` loads each one by path.
files = ["src", "tests", "examples"]
# `tests/must_reject/` fixtures (M1-C Task 2) are deliberately invalid-as-
# typed Python -- the executable must_reject/ subset spec, compiled AS TEXT
# by the runner and never imported (dossier E15, BL-2; precedent for the
# opposite exists in this repo, E3, so this exclusion is deliberate and
# commented, not silent).
exclude = ["^tests/must_reject/"]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"
