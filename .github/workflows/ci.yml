name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: lint, typecheck, test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-groups

      - name: Lint (ruff check)
        run: uv run ruff check .

      # Format-check is scoped to src/tests (mirrors mypy's `files` scope), not
      # `.`: spikes/ is frozen historical evidence and must not be reformatted,
      # and the docs/ planning markdown contains verbatim-transcribed code
      # fences that ruff's formatter also reaches into and would rewrite.
      - name: Format check (ruff format)
        run: uv run ruff format --check src tests

      - name: Type check (mypy --strict)
        run: uv run mypy --strict

      # testpaths = ["tests"] in pyproject.toml, so spikes/ tests are never
      # collected here (deliberate: spikes are frozen evidence, not CI subjects).
      - name: Test (pytest)
        run: uv run --frozen pytest -q
